    - title: 'Module de planification de missions de photogrammétrie agricole'
      context: 'Un objectif du projet Syracuse était de développer un module de suivi de la mission de récolte par simulation de l’environnement et des vecteurs robotiques y évoluant. La photogrammétrie était utilisée pour construire le modèle 3D du verger.'
      problem: 'La récolte d’images par pilotage manuel du drone ne permettait pas de couvrir les zones étudiées de manière efficace et répétable. Le traitement des images par usage manuel du logiciel Meshroom induisait des erreurs de traitement et des pertes de temps.'
      solution: 'Développement d’un module Python intégrant des algorithmes de planification de mission pour le drone, et automatisant l’usage de Meshroom via son API.'
      result: 'Amélioration de 90% de la qualité des images collectées, et optimisation du temps de traitement des images.'
      technical_skills:
        - label: 'Python'
          value: 1
        - label: 'Olympe'
          value: 0.8
        - label: 'Traitement de Données Géospatiales'
          value: 0.9
        - label: 'Meshroom'
          value: 0.7
      soft_skills:
        - label: 'Approche Expérimentale'
          value: 0.9
        - label: 'Rigueur Scientifique'
          value: 1
        - label: 'Prise en Main d’Outils Complexes'
      achievements:
        hyperlinks: []
        media: []

