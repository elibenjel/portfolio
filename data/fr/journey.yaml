      problem: 'Les agriculteurs utilisant la solution Syracuse ont besoin d’un retour visuel suffisant pour surveiller le bon déroulement de la récolte.'
      solution: 'Intégration de Unreal Engine 5 à l’application web interne, de sorte à pouvoir construire et présenter un jumeau numérique du robot ainsi que du verger.'
